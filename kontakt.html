<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alerty | Nocne Niebo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div>Zjawiska Astronomiczne</div>

      <ul class="nav-links">
        <li>
          <a href="index.html">Start</a>
        </li>
        <li>
          <a href="kalendarz.html">Kalendarz</a>
        </li>
        <li class="nav-links">
          <a href="kontakt.html">Alerty</a>
        </li>
      </ul>

      <div>
        <button id="theme-toggle">🌓</button>
      </div>
    </nav>

    <header>
      <h1>Skonfiguruj Alerty</h1>
    </header>

    <main>
      <form class="alert-form" action="#" method="POST">
        <label for="email">Adres e-mail:</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="astro@mail.com"
        />

        <label for="event-type">Wybierz zjawisko:</label>
        <select id="event-type" name="event-type" required>
          <option value="meteory">Meteory (Spadające gwiazdy)</option>
          <option value="zacmienia">Zaćmienia (Słońca i Księżyca)</option>
          <option value="zorze">Zorze polarne</option>
          <option value="ksiezyc">Fazy Księżyca</option>
        </select>

        <label for="message">Uwagi (opcjonalnie):</label>
        <textarea
          id="message"
          name="message"
          rows="3"
          maxlength="300"
          placeholder="Wpisz maksymalnie 300 znaków"
        ></textarea>
        <button type="submit">Włącz powiadomienia</button>
      </form>
    </main>

    <footer>
      <p>Projekt Aplikacje Internetowe | Katarzyna Majcher</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
